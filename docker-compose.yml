# Deployed via Dokploy's "Docker Compose" application type.
#
# Compose (not the plain Application type) because the SQLite file needs a
# Litestream sidecar sharing its volume — the Application type runs one
# container and cannot express that.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time only: Vite inlines these into the bundle.
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_RECAPTCHA_SITEKEY: ${VITE_RECAPTCHA_SITEKEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      # Must live on the volume below, not in the container's writable layer.
      DB_PATH: /data/indiamovieguide.sqlite
      SITE_URL: ${SITE_URL}
      TMDB_API_KEY: ${TMDB_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TMDB_BEARER_TOKEN: ${TMDB_BEARER_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      MOTN_API_KEY: ${MOTN_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Auth / captcha
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      CAPTCHA_BYPASS: ${CAPTCHA_BYPASS:-}
      # Movie of the Night (OTT deeplinks)
      MOTN_COUNTRY: ${MOTN_COUNTRY:-}
      MOTN_DAILY_BUDGET: ${MOTN_DAILY_BUDGET:-}
      MOTN_ATTEMPT_MINUTES: ${MOTN_ATTEMPT_MINUTES:-}
      MOTN_PAUSE_MINUTES: ${MOTN_PAUSE_MINUTES:-}
      MOTN_DEEPLINK_TTL_HOURS: ${MOTN_DEEPLINK_TTL_HOURS:-}
      # YouTube song lookups
      YOUTUBE_PER_TRACK_LOOKUPS: ${YOUTUBE_PER_TRACK_LOOKUPS:-}
      YOUTUBE_QUOTA_BACKOFF_MINUTES: ${YOUTUBE_QUOTA_BACKOFF_MINUTES:-}
      YOUTUBE_SONG_QUERY_LIMIT: ${YOUTUBE_SONG_QUERY_LIMIT:-}
      # Caching / sitemap / seeding
      HTML_CACHE_TTL_MINUTES: ${HTML_CACHE_TTL_MINUTES:-}
      SITEMAP_MAX_URLS: ${SITEMAP_MAX_URLS:-}
      SEED_TITLES: ${SEED_TITLES:-}
      DEBUG_SONGS: ${DEBUG_SONGS:-}
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      # The first boot rebuilds the FTS index over the whole database, which is
      # slow on a multi-GB file. Don't let the healthcheck kill it mid-rebuild.
      start_period: 180s
      retries: 3
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Continuous replication of the SQLite file to object storage. Reads the WAL
  # only — safe to run alongside the writer.
  litestream:
    image: litestream/litestream:0.3.13
    # Opt-in: starts only when COMPOSE_PROFILES=backup is set, so the stack can
    # deploy before object storage exists. Enable it as soon as it does --
    # nothing else backs this database up off-machine.
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      - app
    command: replicate
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - sqlite-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  sqlite-data:

# Created by the Dokploy installer; Traefik routes to containers on it.
networks:
  dokploy-network:
    external: true
